<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planet Jumping</title>
<style>
@font-face{font-family:"SF Pro";src:local("SF Pro");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"SF Pro";src:local("SF Pro Bold"),local("SF Pro");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"SF Pro Thin";src:local("SF Pro Thin"),local("SF Pro");font-weight:100;font-style:normal;font-display:swap}
@font-face{font-family:"Aalto";src:local("Aalto");font-weight:400;font-style:normal;font-display:swap}
:root{font-family:"SF Pro",Arial,sans-serif;color:#fff;background:#090807;font-synthesis:none}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
html,body,button,a,.portal{cursor:none!important}
.experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0908}
.backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
.background{object-fit:cover;opacity:0;transition:opacity .8s ease}
.background.is-visible{opacity:1}
.shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}

.header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);display:flex;justify-content:space-between;align-items:center}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:999px}
.nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1}
.nav a.active{background:#fff;color:#000}
.menu{height:42px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#000}

.planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:6px;font-size:16px}
.planet-item{display:flex;align-items:center;min-height:20px}
.planet-item.active{font-size:18px;font-weight:700;gap:8px}
.planet-item.active:before{content:"";width:16px;height:16px;border-radius:50%;background:#fff;flex:none}

.portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%);perspective:none}
.portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0}
.portal-heading strong{font-size:18px;margin-left:8px}
.portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;border-radius:90px;background:transparent;cursor:pointer;box-shadow:none;transform:none!important}
.portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
.portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}
.scene-canvas{display:none}

.planet-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.planet-content h1{font-family:Aalto,"Arial Narrow",sans-serif;font-size:clamp(128px,21.8vw,314px);font-weight:400;line-height:.72;margin:0 0 -.04em;letter-spacing:0;transform:translateX(-32px);opacity:0}
.planet-content dl{width:min(447px,34vw);margin:0;font-size:16px}
.fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
.fact:last-child{border-bottom:0}
.fact dt{font-weight:700}.fact dd{margin:0}

.transition-layer{display:none}.loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s}
.experience.is-loading .loading{opacity:.8}
.experience.is-transitioning .header,.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
.experience.is-transitioning .shade{opacity:1}
.experience.is-committing .background{transition:none!important}

.preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
.preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
.preloader.is-background{z-index:0}.preloader.is-background .preloader-shade{opacity:0}
.floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:59px;height:58px;transform:translate(-50%,-50%);will-change:left,top,width,height,transform;transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),width 2s cubic-bezier(.16,1,.3,1),height 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1)}
.floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);width:37px;height:36px;transform:none}
.floating-logo.is-settled{z-index:5}
.preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;gap:4px;transform:translateX(-50%);font-family:"SF Pro",Arial,sans-serif;line-height:1}
.preloader-count>span:first-child{font-family:"SF Pro Thin","SF Pro",Arial,sans-serif;font-size:64px;font-weight:100}
.preloader-count .percent{font-size:24px;padding-bottom:4px}
.preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
@keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.preload-complete) .custom-cursor{opacity:0!important}

body:not(.intro-ready) .header,body:not(.intro-ready) .planet-list,body:not(.intro-ready) .planet-content h1,body:not(.intro-ready) .planet-content .fact{opacity:0}
.intro-ready .header{animation:reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both}
.intro-ready .planet-list{animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both}
.content-revealing h1{animation:title-rise 1.05s cubic-bezier(.16,1,.3,1) both}
.content-revealing .fact{animation:fact-rise .72s cubic-bezier(.22,1,.36,1) both}
.content-revealing .fact:nth-child(1){animation-delay:.52s}.content-revealing .fact:nth-child(2){animation-delay:.68s}.content-revealing .fact:nth-child(3){animation-delay:.84s}.content-revealing .fact:nth-child(4){animation-delay:1s}
.mask-revealing .portal-heading{animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item{animation:menu-row .58s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item:nth-child(1){animation-delay:.02s}.planet-list.is-switching .planet-item:nth-child(2){animation-delay:.05s}.planet-list.is-switching .planet-item:nth-child(3){animation-delay:.08s}.planet-list.is-switching .planet-item:nth-child(4){animation-delay:.11s}.planet-list.is-switching .planet-item:nth-child(5){animation-delay:.14s}.planet-list.is-switching .planet-item:nth-child(6){animation-delay:.17s}.planet-list.is-switching .planet-item:nth-child(7){animation-delay:.2s}.planet-list.is-switching .planet-item:nth-child(8){animation-delay:.23s}
.planet-list.is-switching .planet-item.active:before{animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both}
@keyframes reveal-down{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes reveal-side{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes title-rise{from{opacity:0;filter:blur(10px);transform:translate(-32px,35px)}to{opacity:1;filter:blur(0);transform:translate(-32px,0)}}
@keyframes fact-rise{from{opacity:0;filter:blur(7px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes portal-caption{from{opacity:0;filter:blur(7px);transform:translateY(12px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes menu-row{from{opacity:0;filter:blur(5px);transform:translateX(-12px)}to{opacity:1;filter:blur(0);transform:translateX(0)}}
@keyframes active-dot{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

.custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;pointer-events:none;opacity:0;transition:opacity .2s ease}
.custom-cursor.is-visible{opacity:1}
.cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.cursor-dot{width:12px;height:12px;background:#fff}
.cursor-orbit{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-orbit{transform:translate(-50%,-50%) scale(1.16)}
.cursor-label{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);font:16px/1.2 "SF Pro",Arial,sans-serif;white-space:nowrap;opacity:0;transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-label{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:800px){
 .nav a{padding:8px 12px}.menu{padding:0 15px}
 .portal-wrap{width:min(260px,45vw)}
 .planet-content{gap:18px;align-items:flex-end}
 .planet-content h1{font-size:clamp(100px,25vw,210px)}
 .planet-content dl{width:min(390px,46vw);font-size:13px}
 .fact{grid-template-columns:100px 1fr;gap:10px}
}
@media(max-width:600px){
 .experience{min-height:520px}
 .header{right:16px;left:16px}.nav{display:none}
 .planet-list{left:16px;font-size:13px;gap:3px}.planet-item.active{font-size:15px}
 .planet-item.active:before{width:12px;height:12px}
 .portal-wrap{width:170px;top:46%;transform:translate(-50%,-50%)}
 .portal-heading{font-size:12px;margin-bottom:7px}.portal-heading strong{font-size:14px}
 .planet-content{left:18px;right:18px;bottom:18px;display:block}
 .planet-content h1{font-size:clamp(92px,27vw,150px);line-height:.7;margin-bottom:20px}
 .planet-content dl{width:100%;font-size:11px}
 .fact{grid-template-columns:92px 1fr;padding:5px 0;gap:8px}
 .floating-logo.is-docked{left:16px;top:16px}
}
</style>
</head>
<body>
<main class="experience" data-planet="mars">
  <div class="backgrounds" aria-hidden="true">
    <video id="mars-background" class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto"></video>
    <video id="earth-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
    <video id="venus-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto"></video>
  </div>
  <div class="preloader" id="preloader" aria-label="Loading Mars">
    <video id="preloader-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4" muted playsinline preload="auto"></video>
    <div class="preloader-shade"></div>
  </div>
  <img class="floating-logo" id="floating-logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg" alt="Ubernatural">
  <div class="preloader-count" id="preloader-count" aria-live="polite"><span id="preloader-value">0</span><span class="percent">%</span></div>
  <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
  <div class="shade" aria-hidden="true"></div>

  <header class="header chrome">
    <div class="header-actions">
      <nav class="nav" aria-label="Primary navigation">
        <a class="active" href="#about">About</a><a href="#explore">Explore</a><a href="#planets">Planets</a>
      </nav>
      <button class="menu" type="button">Menu</button>
    </div>
  </header>

  <aside class="planet-list chrome" aria-label="Planets"></aside>

  <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>
  <section class="portal-wrap chrome" aria-label="Next destination">
    <div class="portal-heading"><span>Next:</span><span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span></div>
    <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
      <video id="portal-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
      <img id="portal-image" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg" alt="Mercury">
    </button>
  </section>

  <section class="planet-content chrome" aria-live="polite">
    <h1 id="planet-title">MARS</h1>
    <dl id="facts"></dl>
  </section>

  <div class="transition-layer" aria-hidden="true"><video id="transition-video" muted playsinline preload="auto"></video></div>
  <div class="loading" aria-hidden="true">Preparing orbit…</div>
  <div class="custom-cursor" aria-hidden="true">
    <span class="cursor-orbit"></span><span class="cursor-dot"></span><span class="cursor-label">Enter</span>
  </div>
</main>

<script>
(() => {
"use strict";

const BASE="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P";
const MARS_BG=`${BASE}/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4`;
const TO_EARTH=`${BASE}/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4`;
const TO_VENUS=`${BASE}/b30f64d9-1637-477a-83df-d0fc6461a422.mp4`;
const TO_MARS=`${BASE}/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4`;
const MERCURY=`${BASE}/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg`;

const planets=["Mercury","Venus","Earth","Mars","Jupiter","Saturn","Uranus","Neptune"];
const states={
 mars:{name:"Mars",next:"Earth",number:"[03]",portal:TO_EARTH,background:"mars-background",
  facts:[["Distance:","About 228 million km (1.5 astronomical units)."],["Year:","One Martian year is equal to 687 Earth days."],["Temperature:","Around -60 °C, dropping to -125 °C at the poles in winter."],["Atmosphere:","Very thin, consisting of 95% carbon dioxide, with frequent dust storms."]]},
 earth:{name:"Earth",next:"Venus",number:"[02]",portal:TO_VENUS,background:"earth-background",
  facts:[["Distance:","149.6 million km from the Sun."],["Year:","365.25 Earth days."],["Temperature:","Average surface temperature around 15 °C."],["Atmosphere:","Mostly nitrogen and oxygen, supporting life and liquid water."]]},
 venus:{name:"Venus",next:"Mercury",number:"[06]",image:MERCURY,background:"venus-background",
  facts:[["Distance:","108.2 million km from the Sun."],["Year:","225 Earth days."],["Temperature:","Around 465 °C — the hottest planet in the Solar System."],["Atmosphere:","Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid."]]}
};

const root=document.querySelector(".experience");
const preloader=document.getElementById("preloader");
const preloadVideo=document.getElementById("preloader-video");
const count=document.getElementById("preloader-count");
const value=document.getElementById("preloader-value");
const logo=document.getElementById("floating-logo");
const portal=document.getElementById("portal");
const portalVideo=document.getElementById("portal-video");
const portalImage=document.getElementById("portal-image");
const transitionVideo=document.getElementById("transition-video");
const portalCanvas=document.getElementById("portal-canvas");
const sceneCanvas=document.getElementById("scene-canvas");
const pctx=portalCanvas.getContext("2d");
const sctx=sceneCanvas.getContext("2d");
const planetList=document.querySelector(".planet-list");
const title=document.getElementById("planet-title");
const facts=document.getElementById("facts");
const nextName=document.getElementById("next-name");
const nextNumber=document.getElementById("next-number");
const loading=document.querySelector(".loading");

let current="mars", busy=false, expansion=0, maskScale=1, canvasOpacity=1;
let transitionActive=false, frozen=false, firstRender=true;
let rotX=0,rotY=0,targetX=0,targetY=0,lastFrame=performance.now();
let pointerX=0,pointerY=0, cursorStarted=false;
let dpr=Math.min(devicePixelRatio||1,2);

const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

function render(){
 const st=states[current];
 root.dataset.planet=current;
 title.textContent=st.name.toUpperCase();
 nextName.textContent=st.next;
 nextNumber.textContent=st.number;
 portal.setAttribute("aria-label",`Travel to ${st.next}`);
 facts.innerHTML=st.facts.map(([k,v])=>`<div class="fact"><dt>${k.toUpperCase()}</dt><dd>${v}</dd></div>`).join("");
 planetList.innerHTML=planets.map(p=>`<span class="planet-item ${p.toLowerCase()===current?"active":""}">${p}</span>`).join("");
 if(!firstRender){
   planetList.classList.remove("is-switching"); void planetList.offsetWidth; planetList.classList.add("is-switching");
 }
 document.querySelectorAll(".background").forEach(v=>v.classList.toggle("is-visible",v.id===st.background));
 if(st.image){
   portalImage.src=st.image; portalImage.style.display="block"; portalVideo.style.display="none";
 }else{
   portalImage.style.display="none"; portalVideo.style.display="block";
   if(portalVideo.src!==st.portal) portalVideo.src=st.portal;
 }
 firstRender=false;
}

function resizeCanvas(){
 dpr=Math.min(devicePixelRatio||1,2);
 for(const c of [portalCanvas,sceneCanvas]){
   c.width=Math.max(1,innerWidth*dpr); c.height=Math.max(1,innerHeight*dpr);
   c.style.width=innerWidth+"px"; c.style.height=innerHeight+"px";
 }
 pctx.setTransform(dpr,0,0,dpr,0,0);
 sctx.setTransform(dpr,0,0,dpr,0,0);
}

function mediaSize(media){
 return {w:media.videoWidth||media.naturalWidth||innerWidth,h:media.videoHeight||media.naturalHeight||innerHeight};
}
function drawCover(ctx,media){
 const {w:mw,h:mh}=mediaSize(media);
 const scale=Math.max(innerWidth/mw,innerHeight/mh);
 const w=mw*scale,h=mh*scale;
 ctx.drawImage(media,(innerWidth-w)/2,(innerHeight-h)/2,w,h);
}
function drawShade(ctx){
 const g=ctx.createLinearGradient(0,innerHeight*.52,0,innerHeight);
 g.addColorStop(0,"rgba(0,0,0,0)");
 g.addColorStop(1,"rgba(0,0,0,.88)");
 ctx.fillStyle=g;ctx.fillRect(0,innerHeight*.52,innerWidth,innerHeight*.48);
}
function roundedPoints(w,h,r){
 r=Math.max(0,Math.min(r,w/2,h/2));
 const pts=[],steps=10;
 const arcs=[
  [w/2-r,-h/2+r,-Math.PI/2,0],
  [w/2-r,h/2-r,0,Math.PI/2],
  [-w/2+r,h/2-r,Math.PI/2,Math.PI],
  [-w/2+r,-h/2+r,Math.PI,Math.PI*1.5]
 ];
 for(const [cx,cy,a0,a1] of arcs){
   for(let i=0;i<=steps;i++){
     const a=a0+(a1-a0)*i/steps;
     pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);
   }
 }
 return pts;
}
function drawPortal(){
 pctx.setTransform(dpr,0,0,dpr,0,0);
 pctx.clearRect(0,0,innerWidth,innerHeight);
 if(frozen){pctx.drawImage(sceneCanvas,0,0,innerWidth,innerHeight);drawShade(pctx);return;}
 const rect=portal.getBoundingClientRect();
 const e=Math.max(0,Math.min(1,expansion));
 const rcx=rect.left+rect.width/2,rcy=rect.top+rect.height/2;
 const cx=rcx+(innerWidth/2-rcx)*e,cy=rcy+(innerHeight/2-rcy)*e;
 const baseW=rect.width+(innerWidth-rect.width)*e,baseH=rect.height+(innerHeight-rect.height)*e;
 const scale=e?1:maskScale,w=baseW*scale,h=baseH*scale,r=90*(1-e)*scale;
 const rx=rotX*(1-e),ry=rotY*(1-e);
 if(w<=1||h<=1)return;
 const ax=rx*Math.PI/180,ay=ry*Math.PI/180;
 const pts=roundedPoints(w,h,r);
 pctx.save();
 pctx.beginPath();
 pts.forEach(([x,y],i)=>{
   const xx=x*Math.cos(ay),yy=y*Math.cos(ax),z=x*Math.sin(ay)-y*Math.sin(ax),pr=850/(850+z);
   const sx=cx+xx*pr,sy=cy+yy*pr;
   if(i===0)pctx.moveTo(sx,sy);else pctx.lineTo(sx,sy);
 });
 pctx.closePath();
 pctx.globalAlpha=canvasOpacity;
 pctx.clip();
 pctx.fillStyle="#030303";pctx.fillRect(0,0,innerWidth,innerHeight);
 const media=transitionActive?transitionVideo:(states[current].image?portalImage:portalVideo);
 if(media && (media.readyState>=2||states[current].image))drawCover(pctx,media);
 if(transitionActive)drawShade(pctx);
 pctx.restore();
}
function frame(now){
 const dt=Math.min(40,now-lastFrame);lastFrame=now;
 const f=Math.min(1,dt*.009);
 rotX+=(targetX-rotX)*f;rotY+=(targetY-rotY)*f;
 drawPortal();
 const dx=pointerX-(cursorX||pointerX),dy=pointerY-(cursorY||pointerY);
 cursorX+=(pointerX-cursorX)*.2;cursorY+=(pointerY-cursorY)*.2;
 cursor.style.transform=`translate3d(${cursorX}px,${cursorY}px,0)`;
 requestAnimationFrame(frame);
}
function animateValue(setter,duration){
 return new Promise(resolve=>{
   const start=performance.now();
   function step(now){
     const t=Math.min(1,(now-start)/duration);setter(easeInOutCubic(t));
     if(t<1)requestAnimationFrame(step);else resolve();
   }
   requestAnimationFrame(step);
 });
}
function eventPromise(media,event,timeout=1600){
 return new Promise(resolve=>{
   let done=false;
   const finish=()=>{if(done)return;done=true;clearTimeout(timer);media.removeEventListener(event,finish);media.removeEventListener("error",finish);resolve();};
   const timer=setTimeout(finish,timeout);
   media.addEventListener(event,finish,{once:true});media.addEventListener("error",finish,{once:true});
   if(media.readyState>=3)finish();
 });
}
function revealMask(){
 root.classList.remove("mask-revealing");void root.offsetWidth;root.classList.add("mask-revealing");
 maskScale=0;
 return animateValue(v=>maskScale=v,1050);
}
function revealPlanetContent(){
 root.classList.remove("content-revealing");void root.offsetWidth;root.classList.add("content-revealing");
}
async function startExperience(){
 try{
   const st=states[current],media=st.image?portalImage:portalVideo;
   if(media instanceof HTMLVideoElement){
     media.muted=true;
     media.load();
     await eventPromise(media,"canplaythrough",1600);
   }else if(!media.complete) await new Promise(r=>{media.addEventListener("load",r,{once:true});setTimeout(r,1600)});
 }catch(e){}
 await revealMask();
 document.body.classList.add("intro-ready");
 setTimeout(revealPlanetContent,850);
}
let finishDone=false,preloadRaf=0;
function finishPreloader(){
 if(finishDone)return;finishDone=true;
 cancelAnimationFrame(preloadRaf);value.textContent="100";count.classList.add("is-leaving");
 logo.classList.add("is-docked");preloader.classList.add("is-background");
 document.body.classList.add("preload-complete");
 startExperience();
 setTimeout(()=>count.remove(),750);
 setTimeout(()=>logo.classList.add("is-settled"),2000);
}
function preloadTick(){
 if(finishDone)return;
 if(isFinite(preloadVideo.duration)&&preloadVideo.duration>0){
   value.textContent=Math.round(preloadVideo.currentTime/preloadVideo.duration*100);
 }
 preloadRaf=requestAnimationFrame(preloadTick);
}
function beginPreloader(){
 const begin=()=>{
   if(!isFinite(preloadVideo.duration)||preloadVideo.duration<=0)return;
   preloadVideo.playbackRate=Math.max(.25,preloadVideo.duration/3);
   preloadVideo.play().catch(finishPreloader);
   preloadTick();
 };
 if(preloadVideo.readyState>=1)begin();else preloadVideo.addEventListener("loadedmetadata",begin,{once:true});
}
preloadVideo.addEventListener("ended",finishPreloader);
preloadVideo.addEventListener("error",finishPreloader);
beginPreloader();

async function travel(){
 if(busy||current==="venus")return;
 busy=true;targetX=targetY=0;
 const next=current==="mars"?"earth":"venus";
 try{
   transitionVideo.src=states[current].portal;transitionVideo.load();
   root.classList.add("is-loading");
   await eventPromise(transitionVideo,"canplaythrough",1600);
   root.classList.remove("is-loading","content-revealing","mask-revealing");
   root.classList.add("is-transitioning");
   transitionVideo.currentTime=0;transitionVideo.playbackRate=1.3;
   canvasOpacity=1;transitionActive=true;
   await transitionVideo.play().catch(()=>{});
   await animateValue(v=>expansion=v,1100);
   await new Promise(resolve=>{
     if(transitionVideo.ended){resolve();return}
     const done=()=>{transitionVideo.removeEventListener("ended",done);resolve()};
     transitionVideo.addEventListener("ended",done,{once:true});
     setTimeout(resolve,Math.max(250,transitionVideo.duration>0?(transitionVideo.duration-transitionVideo.currentTime)*1000+500:2500));
   });
   sctx.setTransform(dpr,0,0,dpr,0,0);sctx.clearRect(0,0,innerWidth,innerHeight);drawCover(sctx,transitionVideo);
   frozen=true;
   current=next;root.classList.add("is-committing");render();
   await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
   transitionActive=false;expansion=0;maskScale=0;canvasOpacity=1;
   root.classList.remove("is-transitioning","is-committing");
   frozen=false;
   const mask= revealMask();
   setTimeout(revealPlanetContent,100);
   await mask;
   setTimeout(()=>{transitionVideo.removeAttribute("src");transitionVideo.load();busy=false},450);
 }catch(e){
   transitionActive=false;expansion=0;maskScale=1;canvasOpacity=1;frozen=false;
   root.classList.remove("is-loading","is-transitioning","is-committing","content-revealing","mask-revealing");
   busy=false;
 }
}

portal.addEventListener("click",travel);
window.addEventListener("resize",resizeCanvas);
window.addEventListener("pointermove",e=>{
 targetY=(e.clientX/innerWidth-.5)*37.4;
 targetX=(e.clientY/innerHeight-.5)*-33;
 pointerX=e.clientX;pointerY=e.clientY;
 if(!cursorStarted){cursorStarted=true;cursor.classList.add("is-visible");}
});
window.addEventListener("pointerleave",()=>{targetX=targetY=0;cursor.classList.remove("is-visible")});
document.addEventListener("pointerover",e=>{if(e.target.closest("#portal"))cursor.classList.add("is-enter")});
document.addEventListener("pointerout",e=>{if(e.target.closest("#portal"))cursor.classList.remove("is-enter")});

const cursor=document.querySelector(".custom-cursor");
let cursorX=innerWidth/2,cursorY=innerHeight/2;
resizeCanvas();render();requestAnimationFrame(frame);
document.querySelectorAll(".background").forEach(v=>v.play().catch(()=>{}));
})();
</script>
